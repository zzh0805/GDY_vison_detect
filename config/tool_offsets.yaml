# GDY视觉v3工具工作位热加载配置。
#
# 每次/get_tcp_pose解算都会重新读取本文件。standard_to_tool定义为：
# “逆手眼 + 全局修正后的标准活动TCP”到最终工具工作TCP的固定局部变换。
# xyz_mm是标准TCP局部坐标系中的毫米位移，rpy_deg为JAKA RPY角度。
version: 1

# v3.4目标选择（每次解算热加载，修改后不需要重启服务）：
# use_yolo: true  -> 保持原流程，用YOLO检测中心匹配请求框。
# use_yolo: false -> 完全跳过YOLO，以请求target框的几何中心作为目标中心；
#                    根据/get_tcp_pose请求中的code动态选择工件/工具偏移。
# 每个可供无YOLO模式选择的工件都要配置唯一code。
target_selection:
  use_yolo: true

tools:
  greenbtn:
    code: "9-8-1"
    tool_id: tool_green_button
    enabled: true
    # 由v1现场示教结果数学迁移；详见 migration/TOOL_OFFSET_MIGRATION.md。
    standard_to_tool:
      xyz_mm: [109.525640, 52.685308, -16.277166]
      rpy_deg: [-3.005278, -4.276208, -0.141311]

  redbtn:
    code: "9-8-2"
    tool_id: tool_red_button
    enabled: true
    # 与greenbtn同一物理工具，共用迁移后的偏移。
    standard_to_tool:
      xyz_mm: [109.525640, 52.685308, -16.277166]
      rpy_deg: [-3.005278, -4.276208, -0.141311]

  run:
    # 示例映射，请按现场实际名称确认后修改。
    code: "9-7-2"
    tool_id: tool_run
    enabled: true
    standard_to_tool:
      xyz_mm: [0.0, 0.0, 0.0]
      rpy_deg: [0.0, 0.0, 0.0]

  konb1:
    # 示例映射，请按现场实际名称确认后修改。
    code: "9-7-3"
    tool_id: tool_knob_1
    enabled: true
    standard_to_tool:
      xyz_mm: [144.6178, -15.8401, -16.9575]
      rpy_deg: [-0.0006, -0.0020, 0.0004]

  redkonb:
    # 示例映射，请按现场实际名称确认后修改。
    code: "9-8-4"
    tool_id: tool_red_knob
    enabled: true
    standard_to_tool:
      xyz_mm: [152.3221, -9.8886, -21.3184]
      rpy_deg: [0.6305, -0.0013, 0.0012]

  # 红色急停开关9-8-3尚无已确认的工件名称和偏移，确认后按此格式增加：
  # emergency_stop:
  #   code: "9-8-3"
  #   tool_id: tool_emergency_stop
  #   enabled: true
  #   standard_to_tool:
  #     xyz_mm: [待标定, 待标定, 待标定]
  #     rpy_deg: [待标定, 待标定, 待标定]
